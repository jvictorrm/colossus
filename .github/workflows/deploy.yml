name: CI/CD Pipeline - Colossus Game

on:
  push:
    branches: [main]

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do Código
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: 3. Instalar Dependências
        run: npm ci

      - name: 4. Validação Unitária (Backend e Regras do Vitest)
        run: npm run test

      - name: 5. Prepara Ambiente E2E (Navegadores)
        run: npx playwright install --with-deps

      - name: 5.5. Cria .env temporário para o CI
        run: touch .env

      - name: 6. Validação End-to-End (Socket e Integração)
        run: npm run test:e2e

      - name: 7. Build do Next.js (No Servidor do GitHub)
        run: npm run build

      - name: 8. Deploy via Rsync Nativo para a VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Evita o erro de confirmação de "nova máquina" no SSH
          ssh-keyscan -H $HOST >> ~/.ssh/known_hosts
          # Sincroniza os arquivos
          rsync -avz --delete --exclude='.git' --exclude='node_modules' -e "ssh -i ~/.ssh/deploy_key" ./ $USER@$HOST:/var/www/colossus/

      - name: 9. Inicializar o Jogo (Na VPS)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/colossus
            npm install --omit=dev
            pm2 describe colossus > /dev/null 2>&1 && pm2 reload colossus || pm2 start server.js --name colossus
            pm2 save
