name: CI/CD Pipeline - Colossus Game

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do Código
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 3. Instalar Dependências e Build (No Servidor do GitHub)
        run: |
          npm ci
          npm run build

      - name: 4. Deploy via Rsync Nativo para a VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Evita o erro de confirmação de "nova máquina" no SSH
          ssh-keyscan -H $HOST >> ~/.ssh/known_hosts
          # Sincroniza os arquivos, enviando a pasta .next pronta e ignorando o node_modules gigante
          rsync -avz --delete --exclude='.git' --exclude='node_modules' -e "ssh -i ~/.ssh/deploy_key" ./ $USER@$HOST:/var/www/colossus/

      - name: 5. Inicializar o Jogo (Na VPS)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/colossus
            # Instala apenas as bibliotecas necessárias para rodar (ignora as de dev)
            npm install --omit=dev
            # Se o pm2 já estiver rodando o colossus, ele reinicia. Se não, ele cria.
            pm2 describe colossus > /dev/null 2>&1 && pm2 reload colossus || pm2 start server.js --name colossus
            pm2 save
